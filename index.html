<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbaev AI 💜</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#fff;
  background:linear-gradient(135deg,#7b2ff7,#a64dff,#5f6fff);
  background-size:300% 300%;
  animation:bgMove 10s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
header{
  text-align:center;
  padding:20px;
  font-size:22px;
  background:rgba(0,0,0,0.25);
}
#chat{
  height:70vh;
  overflow-y:auto;
  padding:12px;
}
.msg{
  margin:10px;
  padding:12px 14px;
  border-radius:16px;
  max-width:70%;
  white-space:pre-wrap;
  word-wrap:break-word;
}
.user{
  background:linear-gradient(45deg,#ff00cc,#7b2ff7);
  margin-left:auto;
}
.bot{
  background:rgba(255,255,255,0.12);
}
#inputBox{
  display:flex;
  gap:10px;
  padding:10px;
  background:rgba(0,0,0,0.25);
}
#input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.12);
  color:#fff;
  outline:none;
}
#input::placeholder{
  color:rgba(255,255,255,0.65);
}
button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#ff00cc,#7b2ff7);
  color:#fff;
  cursor:pointer;
}
button:disabled{
  opacity:0.7;
  cursor:not-allowed;
}
</style>
</head>
<body>

<header>💜 Urbaev AI</header>

<div id="chat"></div>

<div id="inputBox">
  <input id="input" placeholder="Напиши что-нибудь..." />
  <button id="sendBtn">Спросить</button>
</div>

<script>
let API_KEY = localStorage.getItem("api_key");

if (!API_KEY) {
  API_KEY = prompt("AIzaSyBSw9dyfjEbB_wj0meyRIIFKDXYgH--Hk0");
  if (API_KEY) {
    localStorage.setItem("api_key", API_KEY);
  }
}

const MODEL = "gemini-3-flash-preview";
const URL = "https://generativelanguage.googleapis.com/v1beta/models/" +
  MODEL + ":generateContent?key=" + encodeURIComponent(API_KEY || "");

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  chat.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;

  if (!API_KEY) {
    addMessage("Сначала вставь API key и обнови страницу.", "bot");
    return;
  }

  addMessage(text, "user");
  input.value = "";

  const loading = addMessage("🤖 Думаю...", "bot");
  sendBtn.disabled = true;

  try {
    const res = await fetch(URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              { text: text }
            ]
          }
        ]
      })
    });

    const data = await res.json();
    loading.remove();

    if (!res.ok) {
      addMessage("Ошибка: " + (data.error?.message || "что-то пошло не так"), "bot");
      return;
    }

    const answer = data.candidates?.[0]?.content?.parts
      ?.map(part => part.text || "")
      .join("")
      .trim();

    addMessage(answer || "Ответ пустой.", "bot");
  } catch (err) {
    loading.remove();
    addMessage("Ошибка сети: " + err.message, "bot");
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", function(e) {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
