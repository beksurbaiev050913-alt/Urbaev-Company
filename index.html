<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbaev AI 💜</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
  background:linear-gradient(135deg,#7b2ff7,#a64dff,#5f6fff);
  background-size:300% 300%;
  animation:bgMove 10s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
header{
  text-align:center;
  padding:20px;
  font-size:22px;
  background:rgba(0,0,0,0.3);
}
#chat{
  height:70vh;
  overflow-y:auto;
  padding:10px;
}
.msg{
  margin:10px;
  padding:12px;
  border-radius:15px;
  max-width:70%;
}
.user{
  background:linear-gradient(45deg,#ff00cc,#7b2ff7);
  margin-left:auto;
}
.bot{
  background:rgba(255,255,255,0.1);
}
#inputBox{
  display:flex;
  padding:10px;
  background:rgba(0,0,0,0.3);
}
input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:white;
}
button{
  margin-left:10px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#ff00cc,#7b2ff7);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<header>💜 Urbaev AI</header>

<div id="chat"></div>

<div id="inputBox">
  <input id="input" placeholder="Напиши что-нибудь..." />
  <button id="sendBtn">Спросить</button>
</div>

<script>

// 🔑 ключ (сохраняется)
let API_KEY = localStorage.getItem("openrouter_key");

if (!API_KEY) {
  API_KEY = prompt("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");
  if (API_KEY) {
    localStorage.setItem("openrouter_key", API_KEY);
  }
}

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

// 💬 добавление сообщения
function addMessage(text, type){
  const div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  chat.appendChild(div);
  div.scrollIntoView();
  return div;
}

// 🚀 отправка
async function send(){
  const text=input.value.trim();
  if(!text)return;

  if(!API_KEY){
    addMessage("Вставь API ключ и обнови страницу","bot");
    return;
  }

  addMessage(text,"user");
  input.value="";

  const loading=addMessage("🤖 Думаю...","bot");

  try{
    const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
      method:"POST",
      headers:{
        "Authorization":"Bearer "+API_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        model:"openai/gpt-3.5-turbo",
        messages:[
          {role:"user",content:text}
        ]
      })
    });

    const data=await res.json();
    loading.remove();

    if(!res.ok){
      addMessage("Ошибка: "+(data.error?.message||"что-то пошло не так"),"bot");
      return;
    }

    const answer=data.choices?.[0]?.message?.content;
    addMessage(answer||"Нет ответа","bot");

  }catch(e){
    loading.remove();
    addMessage("Ошибка сети","bot");
  }
}

// кнопка
sendBtn.onclick=send;

// enter
input.addEventListener("keydown",e=>{
  if(e.key==="Enter")send();
});

</script>

</body>
</html>
