<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Urbaev AI 💜</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    color: white;
    overflow: hidden;
}

/* 🌈 НЕОНОВЫЙ ФОН */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, #ff00cc, #7b2ff7, #00f0ff, #ff00cc);
    background-size: 400% 400%;
    animation: neonBG 10s ease infinite;
    z-index: -1;
    filter: blur(80px);
}

@keyframes neonBG {
    0% { transform: translate(0,0); }
    50% { transform: translate(-25%, -25%); }
    100% { transform: translate(0,0); }
}

/* 🧠 HEADER */
header {
    text-align: center;
    padding: 15px;
    font-size: 22px;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.3);
}

/* 💬 ЧАТ */
#chat {
    height: 70vh;
    overflow-y: auto;
    padding: 10px;
}

/* 💭 СООБЩЕНИЯ */
.msg {
    margin: 10px;
    padding: 12px;
    border-radius: 15px;
    max-width: 70%;
    backdrop-filter: blur(10px);
}

.user {
    background: linear-gradient(45deg, #ff00cc, #7b2ff7);
    margin-left: auto;
    box-shadow: 0 0 10px #ff00cc;
}

.bot {
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 10px #7b2ff7;
}

/* 📦 ИНПУТ */
#inputBox {
    display: flex;
    padding: 10px;
    backdrop-filter: blur(10px);
    background: rgba(0,0,0,0.3);
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
}

/* 🚀 КНОПКА */
button {
    margin-left: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(45deg, #ff00cc, #7b2ff7);
    color: white;
    cursor: pointer;
    box-shadow: 0 0 10px #ff00cc;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff00cc;
}
</style>
</head>

<body>

<header>💜 Urbaev AI</header>

<div id="chat"></div>

<div id="inputBox">
    <input id="input" placeholder="Напиши что-нибудь..." />
    <button onclick="send()">Спросить</button>
</div>

<script>
const API_KEY = "AIzaSyBSw9dyfjEbB_wj0meyRIIFKDXYgH--Hk0";

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
    div.scrollIntoView();
}

async function send() {
    const input = document.getElementById("input");
    const text = input.value;

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    addMessage("Думаю...", "bot");

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + API_KEY
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                { role: "user", content: text }
            ]
        })
    });

    const data = await response.json();

    document.querySelectorAll(".bot").forEach(el => {
        if (el.innerText === "Думаю...") el.remove();
    });

    addMessage(data.choices[0].message.content, "bot");
}
</script>

</body>
</html>
