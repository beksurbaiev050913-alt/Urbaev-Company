<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urbaev AI 💜</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    body {
      background: linear-gradient(135deg, #7b2ff7, #a64dff, #5f6fff);
      background-size: 300% 300%;
      animation: bgMove 10s ease infinite;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: rgba(40, 20, 100, 0.45);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 78px);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 14px 90px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 74%;
      margin: 10px 0;
      padding: 14px 16px;
      border-radius: 18px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 0 18px rgba(255, 0, 200, 0.18);
    }

    .user {
      margin-left: auto;
      background: linear-gradient(90deg, #ff00b7, #c000ff);
      border-top-right-radius: 8px;
    }

    .bot {
      margin-right: auto;
      background: rgba(170, 120, 255, 0.25);
      backdrop-filter: blur(8px);
      border-top-left-radius: 8px;
    }

    .input-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 10px;
      background: rgba(70, 30, 140, 0.55);
      backdrop-filter: blur(10px);
      box-shadow: 0 -2px 20px rgba(0,0,0,0.2);
    }

    #input {
      flex: 1;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 16px;
      color: white;
      background: rgba(255, 255, 255, 0.12);
    }

    #input::placeholder {
      color: rgba(255,255,255,0.55);
    }

    button {
      min-width: 102px;
      border: none;
      border-radius: 14px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      background: linear-gradient(90deg, #ff00b7, #ff4dff);
      box-shadow: 0 0 16px rgba(255, 0, 200, 0.35);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.98);
    }

    .typing {
      display: inline-block;
      opacity: 0.9;
    }

    .hint {
      text-align: center;
      opacity: 0.8;
      margin-top: 20px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .msg {
        max-width: 88%;
      }

      header {
        font-size: 21px;
      }

      button {
        min-width: 90px;
      }
    }
  </style>
</head>
<body>
  <header>💜 Urbaev AI</header>

  <div class="app">
    <div id="chat">
      <div class="hint">Напиши сообщение снизу 👇</div>
    </div>
  </div>

  <div class="input-wrap">
    <input id="input" type="text" placeholder="Напиши что-нибудь..." />
    <button onclick="send()">Спросить</button>
  </div>

  <script>
    const API_KEY = prompt("AIzaSyBSw9dyfjEbB_wj0meyRIIFKDXYgH--Hk0");
    const MODEL_URL =
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + encodeURIComponent(API_KEY || "");

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;

      if (!API_KEY) {
        addMessage("Ты не вставил API key.", "bot");
        return;
      }

      const hint = chat.querySelector(".hint");
      if (hint) hint.remove();

      addMessage(text, "user");
      input.value = "";

      const loadingMsg = addMessage("🤖 Думаю...", "bot");

      try {
        const response = await fetch(MODEL_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [
                  { text: text }
                ]
              }
            ]
          })
        });

        const data = await response.json();
        loadingMsg.remove();

        if (!response.ok) {
          addMessage("Ошибка: " + (data.error?.message || "что-то пошло не так"), "bot");
          return;
        }

        const answer =
          data.candidates?.[0]?.content?.parts
            ?.map(part => part.text || "")
            .join("")
            .trim();

        addMessage(answer || "Ответ пустой.", "bot");
      } catch (error) {
        loadingMsg.remove();
        addMessage("Ошибка сети: " + error.message, "bot");
      }
    }

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        send();
      }
    });
  </script>
</body>
</html>
